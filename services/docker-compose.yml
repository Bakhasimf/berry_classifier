version: '3.9'

services:
  api:
    image: berry_api_image
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always
    volumes:
      - /home/bakhasimf/apps/berry_classifier/logs/api:/logs

  bot:
    image: berry_bot_image
    depends_on:
      - api
    restart: always
    volumes:
      - /home/bakhasimf/apps/berry_classifier/logs/bot:/logs

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - /home/bakhasimf/apps/berry_classifier/postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
